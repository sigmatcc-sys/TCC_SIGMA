name: SIGMA CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  quality:

    runs-on: ubuntu-latest

    steps:

      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Executar ESLint
        run: npm run lint

      - name: Executar testes
        run: npm run test

      - name: Gerar build
        run: npm run build